<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>同场景双动画帧差比较</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>同场景双动画 · 帧差比较</h1>
        <p class="sub">
          两段动画均由同一 <code>renderScene()</code> 代码生成，无任何视频/图片加载
        </p>
      </header>

      <section class="toolbar">
        <div class="group" role="group" aria-label="视图模式">
          <button class="mode-btn" data-mode="original">原始（A）</button>
          <button class="mode-btn" data-mode="diff">差分</button>
          <button class="mode-btn" data-mode="overlay">叠加</button>
        </div>
        <div class="group params">
          <label>
            B 太阳色相
            <input id="hue-b" type="range" min="0" max="360" value="15" />
            <span id="hue-b-value">15°</span>
          </label>
          <label>
            差异阈值
            <input id="threshold" type="range" min="0" max="100" value="25" />
            <span id="threshold-value">25</span>
          </label>
        </div>
      </section>

      <section class="stage-wrap">
        <canvas id="stage" width="320" height="200"></canvas>
      </section>

      <section class="timeline-row">
        <button id="play">播放</button>
        <input id="timeline" type="range" min="0" step="1" value="0" />
      </section>

      <section class="metrics">
        <div class="metric">
          <span class="label">关键帧</span>
          <strong id="frame-label">0 / 47</strong>
        </div>
        <div class="metric">
          <span class="label">当前时间</span>
          <strong id="time-label">0.000 s</strong>
        </div>
        <div class="metric">
          <span class="label">变化像素比例</span>
          <strong id="ratio-label">0.00%</strong>
        </div>
        <div class="metric">
          <span class="label">最大差异位置</span>
          <strong id="max-label">(-)</strong>
        </div>
        <div class="metric">
          <span class="label">平均差异距离</span>
          <strong id="mean-label">0.00</strong>
        </div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
