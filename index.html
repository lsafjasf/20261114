<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172220" />
    <title>纸间 · 十二秒小剧场</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 44" role="img">
              <path d="M8 35V14l14-7 14 7v21H8Z" />
              <path d="M14 35V18h20v17M20 35V24h8v11" />
            </svg>
          </span>
          <span class="brand-copy">
            <b>纸间</b>
            <small>PAPER THEATRE</small>
          </span>
        </div>

        <div class="project-heading">
          <span class="eyebrow">当前工程 / PROJECT 01</span>
          <input id="projectName" class="project-name" value="月升之前" maxlength="22" aria-label="工程名称" />
        </div>

        <div class="top-actions">
          <div class="duration-badge" title="固定演出时长">
            <span>时长</span>
            <strong>12.0</strong>
            <small>SEC</small>
          </div>
          <button class="button button-quiet" id="importBtn" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 14v2.5h12V14" /></svg>
            打开
          </button>
          <input id="fileInput" type="file" accept="application/json,.json" hidden />
          <button class="button button-ink" id="saveBtn" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h10l2 2v11H4v-13Zm3 0v5h6v-5M7 16.5v-4h6v4" /></svg>
            保存工程
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <section class="layers-panel">
            <div class="section-heading">
              <div>
                <span class="eyebrow">LAYER CUES</span>
                <h2>图层与编排</h2>
              </div>
              <span class="count-pill" id="layerCount">4 层</span>
            </div>
            <div class="layer-list" id="layerList" aria-label="纸片图层"></div>
            <p class="layer-hint">
              <span class="hint-line"></span>
              D1 最远 · D4 最近，按序展开
            </p>
          </section>

          <section class="inspector" id="inspector" aria-label="图层参数">
            <div class="inspector-heading">
              <div class="selected-swatch" id="selectedSwatch"></div>
              <div>
                <span class="eyebrow">SELECTED LAYER</span>
                <h3 id="selectedName">树</h3>
              </div>
              <button class="depth-tag depth-button" id="depthTag" type="button" title="切换图层深度">D3</button>
            </div>

            <div class="control-group">
              <label class="control-label" for="angleInput">
                <span>展开角度</span>
                <output id="angleValue">8°</output>
              </label>
              <input id="angleInput" type="range" min="0" max="45" step="1" value="8" />
              <div class="range-ends"><span>完全直立</span><span>向后倾</span></div>
            </div>

            <div class="control-group">
              <label class="control-label" for="liftInput">
                <span>升起位移</span>
                <output id="liftValue">96 px</output>
              </label>
              <input id="liftInput" type="range" min="0" max="180" step="1" value="96" />
            </div>

            <div class="control-group">
              <label class="control-label" for="shiftInput">
                <span>横向位移</span>
                <output id="shiftValue">0 px</output>
              </label>
              <input id="shiftInput" type="range" min="-160" max="160" step="1" value="0" />
            </div>

            <div class="mask-control">
              <div class="control-label">
                <span>遮罩窗口</span>
                <output id="maskValue">0.4 – 10.8 s</output>
              </div>
              <div class="mask-range" id="maskRange">
                <span class="mask-fill" id="maskFill"></span>
                <input id="maskInInput" type="range" min="0" max="12" step="0.1" value="0.4" aria-label="遮罩入点" />
                <input id="maskOutInput" type="range" min="0" max="12" step="0.1" value="10.8" aria-label="遮罩出点" />
              </div>
            </div>

            <div class="timing-grid">
              <label class="number-field">
                <span>开始</span>
                <input id="startInput" type="number" min="0" max="11.9" step="0.1" value="0.4" />
                <em>s</em>
              </label>
              <label class="number-field">
                <span>展开</span>
                <input id="durationInput" type="number" min="0.4" max="6" step="0.1" value="2.3" />
                <em>s</em>
              </label>
            </div>
          </section>
        </aside>

        <main class="stage-column">
          <div class="stage-toolbar">
            <div class="stage-status">
              <span class="status-dot" id="statusDot"></span>
              <span id="stageStatus">待播放 · 所有纸片已就位</span>
            </div>
            <div class="stage-tools">
              <button class="icon-button" id="guidesBtn" type="button" aria-pressed="true" title="显示安全框">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4M3 10h14M10 3v14" /></svg>
              </button>
              <button class="icon-button" id="audioBtn" type="button" aria-pressed="true" title="切换纸声">
                <svg class="sound-on" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8h3l4-3v10l-4-3H4V8Zm9-1a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10" /></svg>
              </button>
              <span class="zoom-label">预览 100%</span>
            </div>
          </div>

          <div class="stage-frame">
            <div class="stage-mat" id="stageWrap">
              <canvas id="stageCanvas" width="1100" height="682" aria-label="纸雕剧场画布"></canvas>
              <div class="canvas-vignette"></div>
              <div class="stage-corner top-left">SCENE 01</div>
              <div class="stage-corner top-right">12 SEC / LOOP</div>
              <div class="stage-caption">
                <span class="caption-no">01</span>
                <span id="stageCaption">月升之前，纸树先醒。</span>
              </div>
              <button class="stage-play" id="centerPlay" type="button" aria-label="播放">
                <svg viewBox="0 0 28 28" aria-hidden="true"><path d="m10 7 11 7-11 7V7Z" /></svg>
              </button>
            </div>
          </div>

          <section class="timeline-card" aria-label="时间轴">
            <div class="transport">
              <div class="transport-left">
                <button class="transport-play" id="playBtn" type="button" aria-label="播放">
                  <svg class="play-icon" viewBox="0 0 22 22" aria-hidden="true"><path d="m7 5 10 6-10 6V5Z" /></svg>
                  <svg class="pause-icon" viewBox="0 0 22 22" aria-hidden="true"><path d="M7 5h3v12H7zM13 5h3v12h-3z" /></svg>
                </button>
                <div class="time-readout">
                  <strong id="currentTime">00:00.0</strong>
                  <span>/ 00:12.0</span>
                </div>
              </div>
              <div class="transport-center">
                <button class="icon-button" id="backBtn" type="button" title="回到开头" aria-label="回到开头">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4v12M15 4 7 10l8 6V4Z" /></svg>
                </button>
                <button class="icon-button loop-button is-on" id="loopBtn" type="button" aria-pressed="true" title="循环播放">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8V6h10l-2-2m4 8v2H6l2 2" /></svg>
                  <span>循环</span>
                </button>
                <span class="frame-rate">30 FPS</span>
              </div>
              <div class="transport-right">
                <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8h3l4-3v10l-4-3H4V8Zm9-1a4 4 0 0 1 0 6" /></svg>
                  <span id="soundLabel">纸声开启</span>
                </button>
              </div>
            </div>

            <div class="timeline-scroll" id="timelineScroll">
              <div class="timeline" id="timeline">
                <div class="track-labels" id="trackLabels"></div>
                <div class="track-field" id="trackField">
                  <div class="ruler" id="ruler"></div>
                  <div class="track-rows" id="trackRows"></div>
                  <div class="playhead" id="playhead">
                    <span class="playhead-handle"></span>
                    <span class="playhead-time" id="playheadTime">0.0</span>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
