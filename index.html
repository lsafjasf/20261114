<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浅水池焦散光斑 · WebGL2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06121c; }
  #glcanvas { display: block; width: 100vw; height: 100vh; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(8, 20, 32, 0.78); color: #cfe8ff;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    padding: 12px 14px; border-radius: 10px; width: 250px;
    backdrop-filter: blur(6px); border: 1px solid rgba(120, 190, 255, 0.25);
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; color: #8fd0ff; }
  .row { display: flex; align-items: center; margin: 6px 0; gap: 8px; }
  .row label { flex: 0 0 74px; }
  .row input[type=range] { flex: 1; accent-color: #4db2ff; }
  .row .val { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; background: #144a75; color: #dff1ff; border: 1px solid #3d86c6;
    border-radius: 6px; padding: 5px 0; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #1b5c92; }
  #fps {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    background: rgba(8, 20, 32, 0.78); color: #9fe8a9; padding: 6px 10px;
    border-radius: 8px; font: 13px/1.2 ui-monospace, monospace;
    border: 1px solid rgba(120, 255, 160, 0.25);
  }
  #err {
    position: fixed; inset: 0; display: none; place-items: center;
    color: #ffb0b0; background: #200; font: 16px monospace; padding: 2em;
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="panel">
  <h1>焦散光斑控制台</h1>
  <div class="row"><label>太阳方位角</label><input id="az" type="range" min="0" max="360" step="1" value="125"><span class="val" id="azV"></span></div>
  <div class="row"><label>太阳高度角</label><input id="el" type="range" min="3" max="90" step="1" value="48"><span class="val" id="elV"></span></div>
  <div class="row"><label>波浪强度</label><input id="wave" type="range" min="0" max="2" step="0.01" value="1"><span class="val" id="waveV"></span></div>
  <div class="row"><label>池底深度</label><input id="depth" type="range" min="0.2" max="3" step="0.05" value="1.1"><span class="val" id="depthV"></span></div>
  <div class="btns">
    <button id="pauseBtn">暂停</button>
    <button id="shotBtn">截图</button>
  </div>
</div>
<div id="fps">FPS: --</div>
<div id="err"></div>
<script src="shaders.js"></script>
<script src="app.js"></script>
</body>
</html>
