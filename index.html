<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八格分镜 · 节拍对齐</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>八格分镜 · 合成节拍对齐</h1>
    <div class="toolbar">
      <label>总长度(秒)
        <input id="totalLen" type="number" min="4" max="120" step="0.5" value="16">
      </label>
      <label>BPM
        <input id="bpm" type="number" min="40" max="240" step="1" value="120">
      </label>
      <button id="playBtn">▶ 播放</button>
      <button id="saveBtn">保存 JSON</button>
      <button id="loadBtn">载入 JSON</button>
      <input id="fileInput" type="file" accept="application/json" hidden>
      <span id="status"></span>
    </div>
  </header>

  <main>
    <canvas id="board" width="1200" height="560"></canvas>
    <section id="panelEditor">
      <h2>格子设置 <small>（拖动画布中格子右缘可改时长；被改过的格子在总长度重分配时保持不变）</small></h2>
      <div id="panelRows"></div>
    </section>
  </main>

  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
