<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磁悬浮穿环 · Maglev Rings</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: radial-gradient(ellipse at 50% 30%, #16213e 0%, #0a0f1e 70%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #cfe3ff; user-select: none;
  }
  h1 { font-size: 20px; margin: 14px 0 0; letter-spacing: 4px; font-weight: 600; }
  #stage { position: relative; }
  canvas {
    border-radius: 12px; background: #0b1226;
    box-shadow: 0 0 40px rgba(70, 130, 255, .25), inset 0 0 60px rgba(30, 60, 140, .2);
  }
  #panel {
    display: flex; gap: 18px; align-items: flex-end; padding: 10px 16px;
    background: rgba(20, 32, 64, .75); border-radius: 12px;
    border: 1px solid rgba(90, 140, 255, .25);
  }
  .coil-ctl { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 86px; }
  .coil-ctl label { font-size: 12px; opacity: .85; }
  .coil-ctl .val { font-size: 12px; font-variant-numeric: tabular-nums; color: #7fd0ff; }
  .coil-ctl input[type=range] { width: 84px; accent-color: #4d9fff; }
  .keys { font-size: 10px; opacity: .55; }
  #btns { display: flex; flex-direction: column; gap: 6px; }
  button {
    background: #1d3a6e; color: #cfe3ff; border: 1px solid #4d9fff66;
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #28509a; }
  button.on { background: #2c7a4b; border-color: #5fd695; }
  #hint { font-size: 12px; opacity: .6; margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>磁 悬 浮 穿 环</h1>
  <div id="stage"><canvas id="cv" width="960" height="600"></canvas></div>
  <div id="panel">
    <div class="coil-ctl" data-coil="0">
      <label>左线圈</label><input type="range" min="0" max="2.2" step="0.01" value="0.25">
      <span class="val">0.25 A</span><span class="keys">Q / A</span>
    </div>
    <div class="coil-ctl" data-coil="1">
      <label>右线圈</label><input type="range" min="0" max="2.2" step="0.01" value="0.25">
      <span class="val">0.25 A</span><span class="keys">E / D</span>
    </div>
    <div class="coil-ctl" data-coil="2">
      <label>上线圈</label><input type="range" min="0" max="2.2" step="0.01" value="0.9">
      <span class="val">0.90 A</span><span class="keys">W / S</span>
    </div>
    <div class="coil-ctl" data-coil="3">
      <label>下线圈</label><input type="range" min="0" max="2.2" step="0.01" value="0.08">
      <span class="val">0.08 A</span><span class="keys">R / F</span>
    </div>
    <div id="btns">
      <button id="btnAuto">自动驾驶 (P)</button>
      <button id="btnReset">重置 (空格)</button>
    </div>
  </div>
  <div id="hint">调节四个线圈电流让小球悬浮，依次穿过 3 个圆环，最后缓缓落回底座。电流有延迟，小心扰动气流！</div>
  <script src="physics.js"></script>
  <script src="autopilot.js"></script>
  <script src="render.js"></script>
  <script src="game.js"></script>
</body>
</html>
