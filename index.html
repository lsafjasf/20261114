<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三指机械手抓握策略调试台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>三指机械手抓握策略调试台</h1>
    <div class="rounds">
      <span class="round-chip" id="chip-soft">第一次 · 待测试</span>
      <span class="round-chip" id="chip-medium">第二次 · 待测试</span>
      <span class="round-chip" id="chip-hard">第三次 · 待测试</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel stage-panel">
      <div class="obj-tabs">
        <button class="obj-tab" data-idx="0">软物</button>
        <button class="obj-tab" data-idx="1">中等</button>
        <button class="obj-tab" data-idx="2">硬物</button>
      </div>
      <h2 id="obj-title">第一次 · 软物：海绵球</h2>
      <p class="obj-spec" id="obj-spec"></p>
      <canvas id="stage" width="640" height="480"></canvas>
      <div class="stage-footer">
        <span id="run-status" class="status-pill">待运行</span>
        <div class="legend">
          <span><i style="background:hsl(210,85%,48%)"></i>低力</span>
          <span><i style="background:hsl(120,85%,40%)"></i>正常</span>
          <span><i style="background:hsl(55,90%,50%)"></i>警戒</span>
          <span><i style="background:hsl(0,85%,50%)"></i>危险</span>
        </div>
      </div>
    </section>

    <aside class="panel control-panel">
      <h3>参数调节</h3>
      <label class="slider-row">
        <span>指力（电机上限）<b id="pressure-val">30</b></span>
        <input type="range" id="pressure" min="0" max="100" value="30" />
      </label>
      <label class="slider-row">
        <span>闭合速度 <b id="speed-val">35</b></span>
        <input type="range" id="speed" min="1" max="100" value="35" />
      </label>
      <label class="slider-row">
        <span>接触反馈阈值 <b id="feedback-val">30</b></span>
        <input type="range" id="feedback" min="0" max="100" value="30" />
      </label>

      <h3>实时风险</h3>
      <div class="risk-block">
        <div class="risk-head"><span>形变程度</span><span class="metric-val" id="m-deform"></span></div>
        <div class="bar"><div class="fill fill-green" id="deform-bar"></div></div>
        <div class="risk-head"><span>滑移风险</span><span class="metric-val" id="m-slip"></span></div>
        <div class="bar"><div class="fill fill-green" id="slip-bar"></div></div>
      </div>

      <h3>力学读数（预测）</h3>
      <table class="metrics">
        <tr><td>指尖峰值力</td><td class="metric-val" id="m-peak"></td></tr>
        <tr><td>稳态持握力/指</td><td class="metric-val" id="m-hold"></td></tr>
        <tr><td>防滑所需力/指</td><td class="metric-val" id="m-need"></td></tr>
        <tr><td>压坏余量</td><td class="metric-val" id="m-crush"></td></tr>
        <tr><td>反馈触发力</td><td class="metric-val" id="m-threshold"></td></tr>
        <tr><td>闭合惯性超调</td><td class="metric-val" id="m-overshoot"></td></tr>
      </table>

      <div class="actions">
        <button id="start-btn" class="primary">开始抓取</button>
        <button id="reset-btn">重置本轮</button>
        <button id="mute-btn">静音电机声</button>
      </div>
      <div id="overall" class="overall"></div>
    </aside>
  </main>

  <section class="panel log-panel">
    <h3>运行日志</h3>
    <div id="log"></div>
  </section>

  <script src="js/sim.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
