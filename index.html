<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海床礁体投放模拟</title>
<style>
  :root {
    --panel: #0d2233;
    --panel2: #123048;
    --accent: #39c0a8;
    --warn: #e0a13c;
    --bad: #e05c5c;
    --text: #d7e6ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #06121d;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  #sidebar {
    width: 260px;
    background: var(--panel);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  h1 { font-size: 17px; color: var(--accent); }
  h2 { font-size: 13px; color: #8fb6c9; margin-bottom: 6px; }
  .card { background: var(--panel2); border-radius: 8px; padding: 10px; }
  .reef-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
  }
  .reef-item:hover { background: #1a405c; }
  .reef-item.sel { border-color: var(--accent); background: #16405a; }
  .reef-item canvas { background: #0a1c2b; border-radius: 4px; }
  .reef-item .nm { font-size: 13px; }
  .reef-item .ct { font-size: 11px; color: #7fa3b5; margin-left: auto; }
  #stats div { font-size: 12.5px; margin: 3px 0; display: flex; justify-content: space-between; }
  #stats .ok { color: var(--accent); }
  #stats .warn { color: var(--warn); }
  #stats .bad { color: var(--bad); }
  #verdict { font-size: 13px; line-height: 1.5; }
  #verdict.pass { color: var(--accent); }
  #verdict.fail { color: var(--bad); }
  button {
    background: var(--accent); color: #04241d; border: 0; border-radius: 6px;
    padding: 9px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  button:disabled { background: #3a5563; color: #9db4bf; cursor: not-allowed; }
  #help { font-size: 11.5px; color: #7fa3b5; line-height: 1.7; }
  #main { flex: 1; position: relative; }
  #sea { display: block; width: 100%; height: 100%; }
  #previewTag {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(224,161,60,.92); color: #201400; font-weight: bold;
    padding: 5px 16px; border-radius: 14px; font-size: 13px; display: none;
  }
  #toast {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(10,30,45,.92); padding: 8px 18px; border-radius: 8px;
    font-size: 13px; display: none; border: 1px solid #2a5468;
  }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>🪸 海床礁体投放</h1>
    <div class="card">
      <h2>礁体库存（点击或按 1-5 选择）</h2>
      <div id="reefList"></div>
    </div>
    <div class="card" id="statsCard">
      <h2>实时演算</h2>
      <div id="stats"></div>
    </div>
    <div class="card">
      <h2>验收结果</h2>
      <div id="verdict">尚未投放礁体</div>
    </div>
    <button id="confirmBtn" disabled>确认投放（验收未通过）</button>
    <div class="card" id="help">
      🖱 移动：预览落点<br>
      左键：放置 / 点选已放礁体拖动<br>
      R 或右键：旋转 90°<br>
      Delete：收回选中礁体<br>
      按住空格：预览一年后演化<br>
      目标：鱼类栖息面积最大，<br>
      不堵航道（黄色走廊），<br>
      避免过密导致泥沙堆积。
    </div>
  </div>
  <div id="main">
    <canvas id="sea"></canvas>
    <div id="previewTag">⏩ 一年后演化预览（松开空格返回）</div>
    <div id="toast"></div>
  </div>
<script>
"use strict";
// ================= 基础常量与网格 =================
const COLS = 26, ROWS = 17;
const LANE_R0 = 7, LANE_R1 = 9;          // 航道行范围（含）
const SED_LIMIT = 0.55;                  // 泥沙验收阈值
const MIN_HABITAT = 50;                  // 验收所需最小栖息面积（格）

const canvas = document.getElementById("sea");
const ctx = canvas.getContext("2d");
let CW = 0, CH = 0, CELL = 32, OX = 0, OY = 0;

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  canvas.width = r.width * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
  CW = r.width; CH = r.height;
  CELL = Math.floor(Math.min((CW - 40) / COLS, (CH - 40) / ROWS));
  OX = (CW - CELL * COLS) / 2;
  OY = (CH - CELL * ROWS) / 2;
}
window.addEventListener("resize", resize);

// 简单可复现噪声（值噪声）
function makeNoise(seed) {
  const p = new Uint8Array(256);
  let s = seed;
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const j = s % (i + 1);
    [p[i], p[j]] = [p[j], p[i]];
  }
  const g = (x, y) => p[(p[x & 255] + y) & 255] / 255;
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return g(xi, yi) * (1 - u) * (1 - v) + g(xi + 1, yi) * u * (1 - v)
         + g(xi, yi + 1) * (1 - u) * v + g(xi + 1, yi + 1) * u * v;
  };
}
const noise = makeNoise(20261114);

// 地形：深度 0(浅)~1(深)，基岩起伏
const depth = [], baseFlow = [];
for (let y = 0; y < ROWS; y++) {
  depth[y] = []; baseFlow[y] = [];
  for (let x = 0; x < COLS; x++) {
    const n = noise(x * 0.16, y * 0.16) * 0.7 + noise(x * 0.45, y * 0.45) * 0.3;
    depth[y][x] = Math.min(1, Math.max(0, 0.25 + n * 0.7 + y / ROWS * 0.15));
    // 基础海流：整体向东，受地形与航道约束
    const inLane = y >= LANE_R0 && y <= LANE_R1;
    baseFlow[y][x] = {
      vx: 0.55 + noise(x * 0.3 + 9, y * 0.3) * 0.35 + (inLane ? 0.35 : 0),
      vy: (noise(x * 0.3, y * 0.3 + 7) - 0.5) * 0.3
    };
  }
}

// 派生场（每次摆放后重算）
const field = {
  flow: [],     // {vx,vy,sp}
  light: [],    // 0~1
  sed: [],      // 0~1 泥沙
  fish: [],     // 0~1 鱼类栖息密度
  habCells: 0, sedMax: 0, laneBlocked: 0, avgFlow: 0
};
function blankField() {
  for (const k of ["flow", "light", "sed", "fish"]) {
    field[k] = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  }
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      field.flow[y][x] = { vx: 0, vy: 0, sp: 0 };
}
blankField();

// ================= 礁体定义 =================
// cells: 形状；flowDamp: 阻流；shade: 遮光；hab: 栖息加成半径；count: 库存
const REEFS = [
  { name: "平台礁", color: "#c98f4e", count: 3, flowDamp: 0.45, shade: 0.15, habR: 2.6,
    cells: [[0,0],[1,0],[0,1],[1,1]] },
  { name: "塔礁",   color: "#b0623a", count: 3, flowDamp: 0.7,  shade: 0.5,  habR: 2.2,
    cells: [[0,0],[0,1],[0,2]] },
  { name: "枝状礁", color: "#d4698f", count: 4, flowDamp: 0.3,  shade: 0.2,  habR: 3.0,
    cells: [[0,0],[1,0],[2,0],[0,1]] },
  { name: "环形礁", color: "#8fb84e", count: 2, flowDamp: 0.55, shade: 0.3,  habR: 3.4,
    cells: [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2]] },
  { name: "圆顶礁", color: "#7e9fd4", count: 4, flowDamp: 0.25, shade: 0.1,  habR: 1.8,
    cells: [[0,0],[1,0]] }
];
function rotCells(cells, rot) {
  let c = cells.map(p => p.slice());
  for (let i = 0; i < rot; i++) {
    const mx = Math.max(...c.map(p => p[0]));
    c = c.map(([x, y]) => [mx - y, x]); // 顺时针 90°
  }
  const mx = Math.min(...c.map(p => p[0])), my = Math.min(...c.map(p => p[1]));
  return c.map(([x, y]) => [x - mx, y - my]);
}

// ================= 游戏状态 =================
const state = {
  sel: 0,            // 选中的礁体类型
  rot: 0,            // 旋转 0-3
  mouse: { x: -1, y: -1, gx: -1, gy: -1, in: false },
  placed: [],        // {type, rot, gx, gy, id}
  dragging: null,    // 正在拖动的已放置礁体
  used: REEFS.map(() => 0),
  preview: false,    // 按住空格
  confirmed: false,
  nextId: 1
};

// 库存面板
const reefList = document.getElementById("reefList");
REEFS.forEach((r, i) => {
  const div = document.createElement("div");
  div.className = "reef-item" + (i === 0 ? " sel" : "");
  const cv = document.createElement("canvas");
  cv.width = 44; cv.height = 44;
  const c2 = cv.getContext("2d");
  const cs = rotCells(r.cells, 0);
  const w = Math.max(...cs.map(p => p[0])) + 1, h = Math.max(...cs.map(p => p[1])) + 1;
  const s = Math.min(40 / w, 40 / h);
  c2.fillStyle = r.color;
  cs.forEach(([x, y]) => c2.fillRect(2 + x * s + 1, 2 + y * s + 1, s - 2, s - 2));
  const nm = document.createElement("span");
  nm.className = "nm"; nm.textContent = `${i + 1}.${r.name}`;
  const ct = document.createElement("span");
  ct.className = "ct"; ct.id = "cnt" + i;
  div.append(cv, nm, ct);
  div.onclick = () => selectReef(i);
  reefList.appendChild(div);
});
function selectReef(i) {
  state.sel = i; state.dragging = null;
  document.querySelectorAll(".reef-item").forEach((d, j) =>
    d.classList.toggle("sel", j === i));
}
function refreshCounts() {
  REEFS.forEach((r, i) =>
    document.getElementById("cnt" + i).textContent =
      `剩 ${r.count - state.used[i]}`);
}
refreshCounts();

// ================= 环境模拟 =================
function reefCellsOf(p) {
  return rotCells(REEFS[p.type].cells, p.rot).map(([x, y]) => [p.gx + x, p.gy + y]);
}
function computeFields(yearMode) {
  blankField();
  const reefAt = {};
  for (const p of state.placed)
    for (const [x, y] of reefCellsOf(p))
      if (x >= 0 && x < COLS && y >= 0 && y < ROWS) reefAt[y * COLS + x] = p.type;

  // 1) 流速：基础流 - 礁体阻尼（含下游尾流）
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    let damp = 0;
    for (const p of state.placed) {
      const R = REEFS[p.type];
      for (const [cx, cy] of reefCellsOf(p)) {
        const dx = x - cx, dy = y - cy;
        const d2 = dx * dx + dy * dy;
        if (d2 <= 1) damp = Math.max(damp, R.flowDamp);
        else if (dx > 0 && dx <= 4 && Math.abs(dy) <= 1.5)
          damp = Math.max(damp, R.flowDamp * 0.5 * (1 - dx / 5)); // 尾流
      }
    }
    const b = baseFlow[y][x];
    const k = Math.max(0.08, 1 - damp);
    const vx = b.vx * k, vy = b.vy * (1 - damp * 0.4);
    field.flow[y][x] = { vx, vy, sp: Math.hypot(vx, vy) };
  }

  // 2) 光照：深度与礁体遮光
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    let li = 1 - depth[y][x] * 0.75;
    for (const p of state.placed) {
      const R = REEFS[p.type];
      for (const [cx, cy] of reefCellsOf(p)) {
        const d = Math.hypot(x - cx, y - cy);
        if (d < 2.2) li -= R.shade * (1 - d / 2.2);
      }
    }
    field.light[y][x] = Math.max(0.05, Math.min(1, li));
  }

  // 3) 泥沙：低流速 + 不同礁体间距过近 → 堆积（一年后加剧）
  const dens = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const near = new Set();
    for (const p of state.placed)
      for (const [cx, cy] of reefCellsOf(p))
        if (Math.hypot(x - cx, y - cy) <= 2.5) { near.add(p.id); break; }
    dens[y][x] = near.size;
  }
  field.sedMax = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const slow = Math.max(0, 0.5 - field.flow[y][x].sp);
    let s = slow * 0.4 + Math.max(0, dens[y][x] - 1) * 0.3;
    if (yearMode) s = 1 - (1 - s) * (1 - s * 0.8); // 一年累积
    field.sed[y][x] = Math.min(1, s);
    field.sedMax = Math.max(field.sedMax, field.sed[y][x]);
  }

  // 4) 鱼类：适宜光照+中等流速+靠近礁体+低泥沙
  field.habCells = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    let near = 0;
    for (const p of state.placed) {
      const R = REEFS[p.type];
      for (const [cx, cy] of reefCellsOf(p)) {
        const d = Math.hypot(x - cx, y - cy);
        if (d < R.habR) near = Math.max(near, 1 - d / R.habR);
      }
    }
    const li = field.light[y][x], sp = field.flow[y][x].sp;
    const lightOK = li > 0.35 && li < 0.95 ? 1 : 0.3;
    const flowOK = sp > 0.15 && sp < 0.85 ? 1 : 0.35;
    let f = near * lightOK * flowOK * (1 - field.sed[y][x]);
    if (yearMode) f = Math.min(1, f * 1.25 + (f > 0.4 ? 0.08 : 0)); // 一年繁衍
    field.fish[y][x] = f;
    if (f > 0.35) field.habCells++;
  }

  // 5) 航道堵塞
  field.laneBlocked = 0;
  for (let y = LANE_R0; y <= LANE_R1; y++)
    for (let x = 0; x < COLS; x++)
      if (reefAt[y * COLS + x] !== undefined) field.laneBlocked++;

  let tot = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) tot += field.flow[y][x].sp;
  field.avgFlow = tot / (ROWS * COLS);
}

// ================= 验收 =================
const statsEl = document.getElementById("stats");
const verdictEl = document.getElementById("verdict");
const confirmBtn = document.getElementById("confirmBtn");
function validate() {
  computeFields(state.preview);
  const checks = [
    { ok: field.laneBlocked === 0, txt: `航道畅通（堵塞 ${field.laneBlocked} 格）` },
    { ok: field.sedMax < SED_LIMIT, txt: `泥沙可控（峰值 ${(field.sedMax * 100) | 0}%）` },
    { ok: field.habCells >= MIN_HABITAT, txt: `栖息面积 ${field.habCells}/${MIN_HABITAT} 格` }
  ];
  const pass = state.placed.length > 0 && checks.every(c => c.ok);
  statsEl.innerHTML =
    `<div><span>鱼类栖息面积</span><span class="ok">${field.habCells} 格</span></div>` +
    `<div><span>泥沙峰值</span><span class="${field.sedMax < SED_LIMIT ? "ok" : "bad"}">${(field.sedMax * 100) | 0}%</span></div>` +
    `<div><span>航道占用</span><span class="${field.laneBlocked ? "bad" : "ok"}">${field.laneBlocked} 格</span></div>` +
    `<div><span>平均流速</span><span class="ok">${field.avgFlow.toFixed(2)} kn</span></div>`;
  verdictEl.className = pass ? "pass" : "fail";
  verdictEl.innerHTML = state.placed.length === 0
    ? "尚未投放礁体"
    : checks.map(c => `${c.ok ? "✅" : "❌"} ${c.txt}`).join("<br>") +
      (pass ? "<br><b>验收通过，可确认投放！</b>" : "");
  confirmBtn.disabled = !pass;
  confirmBtn.textContent = pass ? "确认投放 ✅" : "确认投放（验收未通过）";
}
confirmBtn.onclick = () => {
  state.confirmed = true;
  toast(`投放完成！鱼类栖息面积 ${field.habCells} 格，验收通过 🎉`);
  confirmBtn.disabled = true;
  confirmBtn.textContent = "已投放 ✔";
};
let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = "none", 2600);
}

// ================= 输入交互 =================
function toGrid(e) {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  return { gx: Math.floor((mx - OX) / CELL), gy: Math.floor((my - OY) / CELL), mx, my };
}
function canPlace(type, rot, gx, gy, ignoreId) {
  if (state.used[type] - (ignoreId ? 1 : 0) >= REEFS[type].count) return false;
  const occ = new Set();
  for (const p of state.placed) {
    if (p.id === ignoreId) continue;
    for (const [x, y] of reefCellsOf(p)) occ.add(y * COLS + x);
  }
  for (const [x, y] of rotCells(REEFS[type].cells, rot).map(([a, b]) => [gx + a, gy + b])) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
    if (occ.has(y * COLS + x)) return false;
  }
  return true;
}
canvas.addEventListener("mousemove", e => {
  const g = toGrid(e);
  state.mouse = { gx: g.gx, gy: g.gy, mx: g.mx, my: g.my, in: true };
});
canvas.addEventListener("mouseleave", () => state.mouse.in = false);
canvas.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const { gx, gy } = toGrid(e);
  // 点选已放置礁体 → 拖动
  for (const p of state.placed) {
    if (reefCellsOf(p).some(([x, y]) => x === gx && y === gy)) {
      state.dragging = p;
      state.placed = state.placed.filter(q => q !== p);
      state.used[p.type]--;
      state.sel = p.type; state.rot = p.rot;
      selectReef(p.type);
      refreshCounts(); validate();
      return;
    }
  }
  tryPlace();
});
function tryPlace() {
  const { gx, gy } = state.mouse;
  const t = state.sel, r = state.rot;
  if (!canPlace(t, r, gx, gy)) { toast("此处无法放置（越界/重叠/库存不足）"); return; }
  state.placed.push({ type: t, rot: r, gx, gy, id: state.nextId++ });
  state.used[t]++;
  state.confirmed = false;
  refreshCounts(); validate();
}
canvas.addEventListener("contextmenu", e => { e.preventDefault(); state.rot = (state.rot + 1) % 4; });
window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    if (!state.preview) {
      state.preview = true;
      document.getElementById("previewTag").style.display = "block";
      validate();
    }
  } else if (e.key >= "1" && e.key <= "5") selectReef(+e.key - 1);
  else if (e.key === "r" || e.key === "R") state.rot = (state.rot + 1) % 4;
  else if (e.key === "Delete" || e.key === "Backspace") {
    // 收回鼠标下的礁体
    const { gx, gy } = state.mouse;
    for (const p of state.placed) {
      if (reefCellsOf(p).some(([x, y]) => x === gx && y === gy)) {
        state.placed = state.placed.filter(q => q !== p);
        state.used[p.type]--;
        refreshCounts(); validate();
        toast("已收回礁体");
        break;
      }
    }
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "Space") {
    state.preview = false;
    document.getElementById("previewTag").style.display = "none";
    validate();
  }
});

// ================= 渲染 =================
let time = 0;
function draw() {
  time += 0.016;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, CW, CH);

  // 地形底色（深度渐变）
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const d = depth[y][x];
    const r = 10 + d * 8, g = 45 - d * 22, b = 70 - d * 30;
    ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
    ctx.fillRect(OX + x * CELL, OY + y * CELL, CELL, CELL);
  }
  // 航道走廊
  ctx.fillStyle = "rgba(224,161,60,0.13)";
  ctx.fillRect(OX, OY + LANE_R0 * CELL, COLS * CELL, (LANE_R1 - LANE_R0 + 1) * CELL);
  ctx.strokeStyle = "rgba(224,161,60,0.55)";
  ctx.setLineDash([8, 6]);
  ctx.lineWidth = 2;
  ctx.strokeRect(OX, OY + LANE_R0 * CELL, COLS * CELL, (LANE_R1 - LANE_R0 + 1) * CELL);
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(224,161,60,0.8)";
  ctx.font = "12px sans-serif";
  ctx.fillText("⛴ 航道", OX + 6, OY + LANE_R0 * CELL + 15);

  // 泥沙层
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const s = field.sed[y][x];
    if (s > 0.12) {
      ctx.fillStyle = `rgba(168,140,90,${Math.min(0.75, s)})`;
      ctx.fillRect(OX + x * CELL, OY + y * CELL, CELL, CELL);
    }
  }
  // 海流箭头（动画相位随流速）
  ctx.strokeStyle = "rgba(120,200,230,0.6)";
  ctx.lineWidth = 1.4;
  for (let y = 0; y < ROWS; y += 2) for (let x = 0; x < COLS; x += 2) {
    const f = field.flow[y][x];
    const cx = OX + x * CELL + CELL, cy = OY + y * CELL + CELL;
    const ph = (time * f.sp * 2) % 1;
    const len = 6 + f.sp * 12;
    const ax = cx + f.vx * len * (ph - 0.5), ay = cy + f.vy * len * (ph - 0.5);
    ctx.beginPath();
    ctx.moveTo(ax - f.vx * 7, ay - f.vy * 7);
    ctx.lineTo(ax + f.vx * 7, ay + f.vy * 7);
    ctx.stroke();
  }
  // 鱼群（栖息密度 → 鱼点）
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const f = field.fish[y][x];
    if (f > 0.3) {
      const n = Math.ceil(f * 3);
      ctx.fillStyle = `rgba(120,230,190,${0.35 + f * 0.5})`;
      for (let i = 0; i < n; i++) {
        const wob = Math.sin(time * 2 + x * 3 + y * 5 + i * 2.1);
        const fx = OX + x * CELL + CELL * (0.25 + 0.25 * i) + wob * 2;
        const fy = OY + y * CELL + CELL * (0.3 + 0.2 * ((i * 7 + x) % 3)) + Math.cos(time * 1.7 + i) * 2;
        ctx.beginPath();
        ctx.ellipse(fx, fy, 3.2, 1.6, wob * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  // 已放置礁体
  for (const p of state.placed) drawReef(p.type, p.rot, p.gx, p.gy, 1);
  // 放置预览（幽灵）
  if (state.mouse.in && !state.confirmed) {
    const ok = canPlace(state.sel, state.rot, state.mouse.gx, state.mouse.gy);
    drawReef(state.sel, state.rot, state.mouse.gx, state.mouse.gy, 0.45, ok);
  }
  // 网格线
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= COLS; x++) { ctx.moveTo(OX + x * CELL, OY); ctx.lineTo(OX + x * CELL, OY + ROWS * CELL); }
  for (let y = 0; y <= ROWS; y++) { ctx.moveTo(OX, OY + y * CELL); ctx.lineTo(OX + COLS * CELL, OY + y * CELL); }
  ctx.stroke();

  requestAnimationFrame(draw);
}
function drawReef(type, rot, gx, gy, alpha, valid) {
  const R = REEFS[type];
  ctx.globalAlpha = alpha;
  for (const [x, y] of rotCells(R.cells, rot)) {
    const px = OX + (gx + x) * CELL, py = OY + (gy + y) * CELL;
    ctx.fillStyle = valid === undefined ? R.color
      : (valid ? R.color : "#e05c5c");
    ctx.beginPath();
    ctx.roundRect(px + 2, py + 2, CELL - 4, CELL - 4, 5);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fillRect(px + 5, py + 5, CELL - 10, 3);
  }
  ctx.globalAlpha = 1;
}

// ================= 水流音效 =================
// 白噪声 → 低通滤波，截止频率与增益随平均流速变化
let audio = null;
function initAudio() {
  if (audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const len = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  const filt = ac.createBiquadFilter();
  filt.type = "lowpass"; filt.frequency.value = 300;
  const gain = ac.createGain();
  gain.gain.value = 0.0;
  src.connect(filt).connect(gain).connect(ac.destination);
  src.start();
  audio = { ac, filt, gain };
}
window.addEventListener("pointerdown", initAudio, { once: true });
window.addEventListener("keydown", initAudio, { once: true });
function updateAudio() {
  if (!audio) return;
  const t = audio.ac.currentTime;
  const k = Math.min(1, field.avgFlow / 1.1);
  audio.filt.frequency.setTargetAtTime(200 + k * 1400, t, 0.3);
  audio.gain.gain.setTargetAtTime(0.015 + k * 0.06, t, 0.3);
}
setInterval(updateAudio, 400);

// ================= 启动 =================
resize();
validate();
requestAnimationFrame(draw);
</script>
</body>
</html>
