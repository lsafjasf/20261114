<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 秒抽象循环背景 · 接缝检查台</title>
<style>
  :root {
    --bg: #0b0e17; --panel: #141926; --panel2: #1b2233;
    --line: #2a3349; --text: #e7ecf5; --muted: #93a0b8;
    --accent: #4dd6c0; --warn: #ff8a3d; --bad: #ff5470; --good: #46d17c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, "PingFang SC",
      "Microsoft YaHei", sans-serif;
  }
  header { padding: 16px 22px 10px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  header p { margin: 0; color: var(--muted); }
  main { padding: 18px 22px 40px; display: grid; gap: 16px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .controls label { color: var(--muted); }
  input[type="text"] {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 10px; width: 190px;
  }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06231e; font-weight: 600; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .track {
    width: 40px; height: 22px; border-radius: 999px; background: var(--panel2);
    border: 1px solid var(--line); position: relative; transition: .2s;
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--muted); transition: .2s;
  }
  .switch input:checked + .track { background: rgba(77,214,192,.25); border-color: var(--accent); }
  .switch input:checked + .track::after { left: 20px; background: var(--accent); }
  .stage-wrap { display: flex; justify-content: center;
    background: #05070c; border-radius: 10px; padding: 8px; }
  #stage { width: min(100%, 860px); aspect-ratio: 16 / 9; display: block; border-radius: 6px; }
  .timeline { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .timeline input[type="range"] { flex: 1; accent-color: var(--accent); }
  .time-read { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 96px; text-align: right; }
  .round-pill {
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .round-pill b { color: var(--accent); }
  .seam-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .seam-cell h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .seam-cell canvas {
    width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 8px;
    border: 1px solid var(--line); image-rendering: auto; background: #000;
  }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
  .metric-card { background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
  .metric-card h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .metric-row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .metric-row span { color: var(--muted); }
  .delta-bad { color: var(--bad); font-weight: 600; }
  .delta-good { color: var(--good); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.bad { background: rgba(255,84,112,.15); color: var(--bad); }
  .badge.good { background: rgba(70,209,124,.15); color: var(--good); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; }
  .scroll { max-height: 220px; overflow: auto; }
  pre {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; overflow: auto; max-height: 280px; margin: 0; font-size: 11px;
  }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .status-line { color: var(--muted); margin-top: 8px; min-height: 18px; }
  .file-input { display: none; }
  @media (max-width: 900px) { .seam-grid { grid-template-columns: 1fr; } .metrics { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>8 秒抽象动态背景 · 循环接缝检查台</h1>
  <p>纯 Canvas 2D 绘制、无图片资源。拖动播放头到首/末帧检查接缝，开启自动循环修正后对比像素差异。</p>
</header>
<main>
  <section class="panel">
    <h2>参数与控制</h2>
    <div class="controls">
      <label>Seed
        <input type="text" id="seedInput" value="demo-seed-2026">
      </label>
      <button id="regenBtn" class="primary">重新生成</button>
      <button id="randomBtn">随机 seed</button>
      <label class="switch" title="将所有运动频率吸附到 8 秒整数周期">
        <input type="checkbox" id="fixToggle">
        <span class="track"></span>
        <span>自动循环修正</span>
      </label>
      <span id="modeBadge" class="badge bad">未修正 · 接缝断开</span>
    </div>
  </section>

  <section class="panel">
    <h2>预览（拖到最左 = 首帧 t=0，最右 = 末帧 t=8）</h2>
    <div class="stage-wrap"><canvas id="stage" width="640" height="360"></canvas></div>
    <div class="timeline">
      <button id="playBtn">▶ 播放</button>
      <button id="firstBtn">⏮ 首帧</button>
      <button id="lastBtn">末帧 ⏭</button>
      <input type="range" id="scrubber" min="0" max="8" step="0.01" value="0">
      <span class="time-read" id="timeRead">t = 0.00 s</span>
      <span class="round-pill">循环轮次 <b id="roundCount">0</b> / 3</span>
    </div>
    <div class="row-actions">
      <button id="loop3Btn" class="primary">自动连续播放 3 轮并检测跳变</button>
      <button id="offlineBtn">离线 30fps × 3 轮接缝分析</button>
      <span id="loopStatus" class="status-line"></span>
    </div>
  </section>

  <section class="panel">
    <h2>末帧 / 首帧 / 像素差热图（当前模式）</h2>
    <div class="seam-grid">
      <div class="seam-cell"><h3>首帧 t = 0</h3><canvas id="firstCanvas" width="640" height="360"></canvas></div>
      <div class="seam-cell"><h3>末帧 t = 8</h3><canvas id="lastCanvas" width="640" height="360"></canvas></div>
      <div class="seam-cell"><h3>像素差热图（蓝→红 = 差异增大）</h3><canvas id="heatCanvas" width="640" height="360"></canvas></div>
    </div>
    <div class="metrics">
      <div class="metric-card" id="rawCard">
        <h3>修正前（原始频率）</h3>
        <div id="rawMetrics"></div>
      </div>
      <div class="metric-card" id="fixCard">
        <h3>修正后（整数周期吸附）</h3>
        <div id="fixMetrics"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>频率吸附明细（只改频率，颜色/形状参数不变）</h2>
    <div class="scroll"><table id="snapTable"></table></div>
  </section>

  <section class="panel">
    <h2>参数 JSON（seed 可复现：相同 seed 生成逐像素一致的画面）</h2>
    <div class="row-actions">
      <button id="copyBtn">复制 JSON</button>
      <button id="downloadBtn">下载 .json</button>
      <button id="loadBtn">载入 JSON…</button>
      <input type="file" class="file-input" id="fileInput" accept=".json,application/json">
    </div>
    <pre id="jsonView"></pre>
    <div class="status-line" id="ioStatus"></div>
  </section>
</main>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
